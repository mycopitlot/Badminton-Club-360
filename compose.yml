services:
  db:
    image: postgres:16
    container_name: badminton-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badminton_club_web
    ports:
      - "5432:5432"
    volumes:
      - badminton_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d badminton_club_web"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  badminton_pgdata: